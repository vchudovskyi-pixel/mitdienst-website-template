<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>[COMPANY_NAME]</title>
    <script type="text/javascript">
      var l = window.location
      var basePath = '%BASE_URL%'.replace(/\/$/, '')
      var baseSegments = basePath.split('/').filter(Boolean).length
      var route = l.pathname
        .split('/')
        .filter(Boolean)
        .slice(baseSegments)
        .join('/')
        .replace(/&/g, '~and~')

      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          (basePath || '') +
          '/?/' +
          route +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>

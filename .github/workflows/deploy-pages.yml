name: Deploy static preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          export VITE_APP_BASE_PATH="$(python - <<'PY'
import os
from urllib.parse import quote

owner = os.environ['GITHUB_OWNER']
repo_name = os.environ['GITHUB_REPOSITORY'].split('/', 1)[1]
encoded_repo = quote(repo_name, safe='')
encoded_root_repo = quote(f'{owner}.github.io', safe='')

if encoded_repo.lower() == encoded_root_repo.lower():
    print('/')
else:
    print(f'/{encoded_repo}/')
PY
          )"
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
